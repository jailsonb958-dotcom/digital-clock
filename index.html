<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Relógio digital moderno, responsivo e acessível.">
    <meta name="theme-color" content="#0b1020">
    <title>Chronos — Relógio digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/style.css">
    <script src="src/js/clock.js" defer></script>
</head>
<body>
    <main class="page-shell">
      <section class="clock-card" aria-labelledby="page-title">
        <div class="card-header">
          <div class="brand-lockup"><span class="brand-mark" aria-hidden="true">◷</span><div><p class="eyebrow">Seu tempo, no seu ritmo</p><h1 id="page-title">Chronos</h1></div></div>
          <span class="live-indicator"><span aria-hidden="true"></span> Ao vivo</span>
        </div>
        <div class="clock-display" aria-label="Horário atual">
          <div class="time-unit"><span id="hours" class="time-value">00</span><span class="time-label">Horas</span></div>
          <span class="time-separator" aria-hidden="true">:</span>
          <div class="time-unit"><span id="minutes" class="time-value">00</span><span class="time-label">Minutos</span></div>
          <span class="time-separator" aria-hidden="true">:</span>
          <div class="time-unit"><span id="seconds" class="time-value">00</span><span class="time-label">Segundos</span></div>
        </div>
        <div class="clock-meta"><p id="date">Carregando data...</p><span class="meta-divider" aria-hidden="true"></span><p id="period">--</p></div>
        <div class="card-footer"><p id="timezone">Horário local</p><button id="format-toggle" class="format-toggle" type="button" aria-pressed="false">Usar formato 24h</button></div>
      </section>
      <p class="footer-note">Um pequeno projeto para acompanhar grandes momentos.</p>
    </main>
</body>
</html>
